<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Story for Anna</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background-image: url(can.jpg);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

   
    .teddy {
      position: absolute;
      width: 80px;
      animation: float 6s ease-in-out infinite;
      opacity: 0.8;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }
    
    .container {
      background-image: url(download.jpg);
      padding: 20px;
      border-radius: 20px;
      max-width: 700px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 16px;
    }
    .next { background-color: white; color: #3E2723; }
    .option { background-color: #4CAF50; color: white; }
    .option2 { background-color: #FFC107; color: white; }
    button:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome, Anna</h1>
    <p id="message">I’ve made something special to share a little about me and how you’ve changed my life.</p>
    <div id="controls">
      <a href="page1.html"><button class="next">Start</button></a>
    </div>
  </div>

  

  <img src="teddy.png" class="teddy" style="top: 10%; left: 40%; animation-delay: 0s;">
  <img src="h.png" class="teddy" style="top: 10%; left: 50%; animation-delay: 1s;">
  <img src="teddy.png" class="teddy" style="top: 10%; left: 60%; animation-delay: 0s;">












</body>
</html>
